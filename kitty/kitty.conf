# Colors are generated by matugen from the current wallpaper (see
# ../matugen/) -- this file only pulls them in, it never defines colors
# itself.
include colors.conf

# Remote control is what lets apply-colors (../../home.nix) push new
# colors into already-open kitty windows without restarting them.
# socket-only (not "yes") means only local Unix-socket clients can send
# commands -- nothing over the wire. {kitty_pid} keeps each kitty
# process's socket distinct so multiple open windows don't collide.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# Background opacity (needs a compositor -- picom/Hyprland both qualify).
background_opacity 0.8

# Default (-1) asks for confirmation when closing a window that has a
# foreground command still running in it (not just sitting at a shell
# prompt) -- that's the quit/close prompt. 0 disables it entirely.
confirm_os_window_close 0

# Default is block -- I-beam instead.
cursor_shape beam
