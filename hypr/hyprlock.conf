# Colors ($accent, $text, ...) and the background block (current wallpaper +
# blur) are both generated by apply-colors (~/.local/bin, source in ../bin/)
# on every session start and wallpaper change, so the lock screen always
# matches the desktop. Colors must be sourced before anything uses them.
source = ~/.cache/hypr/hyprlock-colors.conf
source = ~/.cache/hypr/hyprlock-wallpaper.conf

general {
    hide_cursor = true
}

# Clock
label {
    monitor =
    text = <b>$TIME</b>
    color = $text
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 4
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $muted
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    position = 0, 110
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    rounding = -1
    check_color = $accent2
    fail_color = $urgent
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -30
    halign = center
    valign = center
}
