# hyprpaper 0.8.4's actual config syntax -- the original dotfile's
# `preload = ...` and single-line `wallpaper =, ...` directives don't
# exist in this version's parser at all (confirmed against hyprpaper's
# own ConfigManager.cpp: only splash/splash_offset/splash_opacity/ipc,
# the `wallpaper { }` block, and `source` are registered).
#
# NOT what actually loads at session start anymore -- hyprland.lua's
# autostart now launches hyprpaper with `-c` pointed at a runtime config
# random-wallpaper (../home.nix) generates fresh on every login, so a
# random pick from ~/Pictures/wallpapers/ is what's actually shown. This
# file is kept as a manual fallback/reference (e.g. `hyprpaper -c
# ~/.config/hypr/hyprpaper.conf` by hand) and as documentation of the
# real block syntax.
#
# splash = false: hyprpaper has its OWN splash-text overlay (default
# enabled -- ConfigManager.cpp: addConfigValue("splash", INT{1})),
# entirely separate from Hyprland's own misc:disable_splash_rendering
# (hyprland.lua) -- that's what "Check out quickshell!" etc. actually
# was. Two unrelated programs, two unrelated splash features.
splash = false
#
# One block per real monitor (matching ./hyprland.lua's monitor names)
# plus an empty-monitor fallback block for anything unlisted (e.g.
# HDMI-A-1, only ever active as DP-1's mirror) -- see
# https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/#setting-wallpapers.

wallpaper {
    monitor = DP-1
    path = ~/Pictures/wallpapers/cosmic.jpg
    fit_mode = cover
}

wallpaper {
    monitor = DP-2
    path = ~/Pictures/wallpapers/cosmic.jpg
    fit_mode = cover
}

wallpaper {
    monitor = DP-3
    path = ~/Pictures/wallpapers/cosmic.jpg
    fit_mode = cover
}

wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/cosmic.jpg
    fit_mode = cover
}
