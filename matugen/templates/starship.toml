# Generated by matugen from the current wallpaper -- do not edit by hand.
# Edit ~/.config/matugen/templates/starship.toml instead.
# Icons are TOML escapes (JetBrainsMono Nerd Font glyphs) to keep this ASCII.

add_newline = true
format = "$directory$git_branch$git_status$python$cmd_duration$line_break$character"
palette = "matugen"

[palettes.matugen]
accent = "{{colors.primary.default.hex}}"
accent2 = "{{colors.tertiary.default.hex}}"
text = "{{colors.on_surface.default.hex}}"
muted = "{{colors.outline.default.hex}}"
red = "{{colors.red.default.hex}}"
yellow = "{{colors.yellow.default.hex}}"
green = "{{colors.green.default.hex}}"

[directory]
style = "bold accent"
read_only = " "
read_only_style = "red"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "accent2"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"

[python]
symbol = " "
style = "green"
format = "[$symbol$virtualenv]($style) "
detect_extensions = []
detect_files = []

[cmd_duration]
min_time = 2000
style = "muted"
format = "[ $duration]($style) "

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold red)"
