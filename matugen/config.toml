# matugen config -- run by apply-colors (../bin/apply-colors) against the
# current wallpaper. Each template is rendered into the file the matching
# app already imports, so changing wallpaper recolors everything.

[config]

[templates.gtk-colors]
input_path = "~/.config/matugen/templates/colors.css"
output_path = "~/.config/hypr/colors.css"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"

[templates.shell]
input_path = "~/.config/matugen/templates/colors.sh"
output_path = "~/.cache/hypr/colors.sh"

[templates.wofi]
input_path = "~/.config/matugen/templates/wofi-style.css"
output_path = "~/.config/wofi/style.css"

[templates.fastfetch]
input_path = "~/.config/matugen/templates/fastfetch.jsonc"
output_path = "~/.config/fastfetch/config.jsonc"
