# Portal backends. The desktop-specific hyprland-portals.conf is only used
# when xdg-desktop-portal starts after Hyprland has exported
# XDG_CURRENT_DESKTOP; if it gets D-Bus-activated earlier it falls back to
# this file. Without it nothing provides the Settings portal, and Flatpak
# apps (Zen) never learn the desktop prefers dark.
[preferred]
default=hyprland;gtk
